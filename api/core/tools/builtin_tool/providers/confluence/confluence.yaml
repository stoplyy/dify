  zh_Hans: 协助访问confluence
  pt_BR: 协助访问confluence
icon: icon.jpeg
credentials_for_provider:
parameters: # 参数列表
  - name: userName # 参数名称 
    type: string # 参数类型
    required: false # 是否必填
    label: # 参数标签
      en_US: userName # 英文标签
      zh_Hans: userName # 中文标签
      ja_JP: userName # 日文标签
      pt_BR: userName # 葡萄牙文标签
    placeholder: # 凭据字段占位符
      en_US: Please input your username # 英文占位符
      zh_Hans: 请输入你的用户名 # 中文占位符
      ja_JP: ユーザー名を入力してください # 日文占位符
      pt_BR: Por favor, insira seu nome de usuário # 葡萄牙文占位符
    help: # 凭据字段帮助文本
      en_US: Get your username from confluence # 英文帮助文本
      zh_Hans: 从 confluence 获取你的用户名 # 中文帮助文本
      ja_JP: confluenceからユーザー名を取得する # 日文帮助文本
      pt_BR: Obtenha seu nome de usuário do confluence # 葡萄牙文帮助文本
    url: https://confluence.atlassian.com/cloud/api-tokens-938839802.html # 凭据字段帮助链接
  - name: password # 参数名称
    type: secret-input # 参数类型
    required: false # 是否必填
    label: # 参数标签
      en_US: password # 英文标签
      zh_Hans: password # 中文标签
      ja_JP: password # 日文标签
      pt_BR: password # 葡萄牙文标签
    placeholder: # 凭据字段占位符
      en_US: Please input your password # 英文占位符
      zh_Hans: 请输入你的密码 # 中文占位符
      ja_JP: パスワードを入力してください # 日文占位符
      pt_BR: Por favor, insira sua senha # 葡萄牙文占位符
    help: # 凭据字段帮助文本
      en_US: Get your password from confluence # 英文帮助文本
      zh_Hans: 从 confluence 获取你的密码 # 中文帮助文本
      ja_JP: confluenceからパスワードを取得する # 日文帮助文本
      pt_BR: Obtenha sua senha do confluence # 葡萄牙文帮助文本
    url: https://confluence.atlassian.com/cloud/api-tokens-938839802.html # 凭据字段帮助链接
  - name: baseUrl # 参数名称
    type: string # 参数类型
    required: true # 是否必填
    label: # 参数标签
      en_US: baseUrl # 英文标签
      zh_Hans: baseUrl # 中文标签
      ja_JP: baseUrl
      pt_BR: baseUrl # 葡萄牙文标签
    human_description: # 用于前端展示的介绍，支持多语言
      en_US: confluence baseUrl
      zh_Hans: confluence baseUrl
      ja_JP: confluence baseUrl
      pt_BR: confluence baseUrl
    llm_description: confluence baseUrl
    form: form # 表单类型，llm表示这个参数需要由Agent自行推理出来，前端将不会展示这个参数
  - name: pageId # 参数名称
    type: number # 参数类型
    required: false # 是否必填
    label: # 参数标签
      en_US: pageId # 英文标签
      zh_Hans: pageId # 中文标签
      ja_JP: pageId # 日文标签
      pt_BR: pageId # 葡萄牙文标签
    placeholder: # 凭据字段占位符
      en_US: Please input your pageId # 英文占位符
      zh_Hans: 请输入你的pageId # 中文占位符
      ja_JP: ページIDを入力してください # 日文占位符
      pt_BR: Por favor, insira seu pageId # 葡萄牙文占位符
    help: # 凭据字段帮助文本
      en_US: Get your pageId from confluence # 英文帮助文本
      zh_Hans: 从 confluence 获取你的pageId # 中文帮助文本
      ja_JP: confluenceからページIDを取得する # 日文帮助文本
      pt_BR: Obtenha seu pageId do confluence # 葡萄牙文帮助文本
    url: https://confluence.atlassian.com/cloud/api-tokens-938839802.html # 凭据字段帮助链接
